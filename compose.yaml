services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wallet}
      MYSQL_USER: ${DB_USER:-wallet}
      MYSQL_PASSWORD: ${DB_PASSWORD:?copy .env.example to .env and set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?copy .env.example to .env and set DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Only 01_schema.sql is mounted, so the drop script can never run by accident.
      # Executed once, on first start with an empty data directory.
      - ./db/mysql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
