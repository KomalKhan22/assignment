# Activate with: --spring.profiles.active=mysql   (see README)
# Credentials come from environment variables - nothing secret is committed.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wallet}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:wallet}
spring.datasource.password=${DB_PASSWORD}
# Schema is managed by db/mysql/01_schema.sql, Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false
